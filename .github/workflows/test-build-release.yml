# Bundled bigpowers CI template — Go. See test-build-release-node.yml for
# the override mechanism (BIGPOWERS_CI_TEMPLATES). GH #104.
#
# Dependency-free Go module: no cache/restore step is required.
#
# The test job runs `-race` on ubuntu-latest because the android/arm64
# development host cannot run the race detector (release gate blocker
# recorded in specs/verifications/e02s02-verify.yaml).
#
# No release job: this module has no tagged release yet and no publishing
# step. Add one when a real release action exists.
name: Test Build Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Read the version from go.mod so `go vet` cannot drift from the module.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -race

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      # Mirror the render.yaml deploy build to catch cross-compile breakage.
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o app .
